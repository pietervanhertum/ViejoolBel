# Access-point configuration for headless onboarding (FR-19).
# Started by viejoolbel-ap.sh only when no known WiFi is joinable.
interface=wlan0
driver=nl80211
ssid=ViejoolBel-Setup
hw_mode=g
channel=7
wmm_enabled=0
auth_algs=1
ignore_broadcast_ssid=0
# WPA2 so the setup network is not fully open; the password is printed on the
# device label. Change it in this file before deployment if desired.
wpa=2
wpa_passphrase=belsetup2025
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
