<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ViejoolBel{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">🔔 ViejoolBel</span>
    {% if request.session.get('user') %}
    <form method="post" action="/logout" class="inline">
      <button class="link">Uitloggen</button>
    </form>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer><small>ViejoolBel {{ version | default('') }}</small></footer>
</body>
</html>
